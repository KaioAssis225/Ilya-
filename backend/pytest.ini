[pytest]
testpaths = tests
asyncio_mode = strict
addopts =
    --junitxml=test-results/pytest.xml
    --strict-markers
    -ra
    -q

markers =
    unit: testes de lógica pura sem dependências externas reais
    contract: testes de contrato HTTP usando TestClient ou verificação de schema OpenAPI
    integration: testes com PostgreSQL, Redis ou MinIO reais (nenhum no baseline atual)

filterwarnings =
    error
    ignore:Using `httpx` with `starlette.testclient` is deprecated:
    ignore:The noload\(\) option is deprecated:sqlalchemy.exc.SADeprecationWarning
