name: Monitor de produção

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-health-monitor
  cancel-in-progress: false

jobs:
  health:
    name: Verificar API de produção
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validar disponibilidade e prontidão
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in live ready; do
            curl \
              --silent \
              --show-error \
              --fail \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --max-time 20 \
              --output /dev/null \
              "https://ilya-production-7857.up.railway.app/health/${endpoint}"
          done

      - name: Executar monitor sintético (saúde + sonda comercial inerte por padrão)
        shell: bash
        env:
          SYNTHETIC_COMMERCIAL_ENABLED: ${{ vars.SYNTHETIC_COMMERCIAL_ENABLED || 'false' }}
          ILYA_CANARY_BR_USERNAME: ${{ secrets.ILYA_CANARY_BR_USERNAME }}
          ILYA_CANARY_BR_PASSWORD: ${{ secrets.ILYA_CANARY_BR_PASSWORD }}
          ILYA_CANARY_EU_USERNAME: ${{ secrets.ILYA_CANARY_EU_USERNAME }}
          ILYA_CANARY_EU_PASSWORD: ${{ secrets.ILYA_CANARY_EU_PASSWORD }}
        run: |
          set -euo pipefail
          python3 ops/synthetic_monitor.py \
            --mode check \
            --base-url "https://ilya-production-7857.up.railway.app" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --commit-sha "${GITHUB_SHA}" \
            --output /tmp/synthetic-monitor-result.json

      - name: Abrir ou atualizar alerta
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require("fs");
            let configError = false;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const nowUtc = new Date().toISOString();
            const nowSp = new Date().toLocaleString("sv-SE", { timeZone: "America/Sao_Paulo" }).replace(" ", "T") + "-03:00";

            let body = "";
            const resultPath = "/tmp/synthetic-monitor-result.json";
            if (fs.existsSync(resultPath)) {
              try {
                const parsed = JSON.parse(fs.readFileSync(resultPath, "utf8"));
                configError = Array.isArray(parsed?.failures) && parsed.failures.some((failure) => failure?.status === "config_error");
                if (parsed && typeof parsed.alert_body === "string" && parsed.alert_body.trim()) {
                  body = parsed.alert_body;
                }
              } catch (err) {
                core.warning(`Não foi possível ler ${resultPath}: ${err.message}`);
              }
            }

            const title = configError
              ? "[ALERTA] Monitor sintético Ilya com configuração inválida"
              : "[ALERTA] API Ilya de produção indisponível";

            if (!body) {
              body = [
                "<!-- synthetic-monitor-failure -->",
                "",
                "## Monitor sintético — falha detectada",
                "",
                `O monitor automático não conseguiu validar \`/health/live\` e \`/health/ready\` diretamente na Railway.`,
                "",
                `- **Horário (UTC):** \`${nowUtc}\``,
                `- **Horário (America/Sao_Paulo -03:00):** \`${nowSp}\``,
                `- **Commit:** \`${context.sha}\``,
                `- **Execução:** ${runUrl}`,
                "",
                "Verifique o deployment, os logs e as dependências Postgres/Redis na Railway.",
              ].join("\n");
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Avaliar recuperação após duas execuções saudáveis consecutivas
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require("fs");
            const { execFileSync } = require("child_process");
            const titles = new Set([
              "[ALERTA] API Ilya de produção indisponível",
              "[ALERTA] Monitor sintético Ilya com configuração inválida",
            ]);
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const alerts = issues.filter(
              (issue) => !issue.pull_request && titles.has(issue.title),
            );
            for (const issue of alerts) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              });
              const bodies = [issue.body || "", ...comments.map((c) => c.body || "")];
              fs.writeFileSync("/tmp/issue-comments.json", JSON.stringify(bodies));
              execFileSync("python3", [
                "ops/synthetic_monitor.py",
                "--mode", "recovery",
                "--comments-file", "/tmp/issue-comments.json",
                "--output", "/tmp/recovery-decision.json",
              ]);
              const decision = JSON.parse(fs.readFileSync("/tmp/recovery-decision.json", "utf8"));
              if (decision.comment_body) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: decision.comment_body,
                });
              }
              if (decision.should_close === true) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed",
                });
              }
            }
