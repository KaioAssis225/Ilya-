name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Segunda-feira 06:00 UTC — auditoria contínua de dependências mesmo sem
    # PR/push novo (uma CVE pode ser publicada para uma dependência já
    # instalada a qualquer momento).
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Validar código
        run: npm run lint

      - name: Verificar bundle do PDF (servidor)
        run: npm run check:pdf-bundle

      - name: Executar testes
        run: npm run test:coverage

      - name: Publicar resultados Vitest (JUnit e cobertura)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-test-results
          path: |
            frontend/test-results/junit.xml
            frontend/coverage/cobertura-coverage.xml
            frontend/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

      - name: Gerar build de produção
        run: npm run build

  frontend-audit:
    name: Frontend — auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Auditar dependências (CVEs de alta severidade ou crítica)
        run: npm audit --audit-level=high

  backend-tests:
    name: Backend — testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ilya_test
      SECRET_KEY: ci-secret-key-with-at-least-32-characters
      PASSWORD_PEPPER: ci-password-pepper-not-used-in-production
      BACKEND_CORS_ORIGINS: '["http://localhost:5173"]'
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências (produção + teste)
        run: pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Executar testes (excluindo integração)
        run: python -m pytest -q -m "not integration and not pdf_render" --cov=app --cov-report=xml --cov-report=term-missing

      - name: Publicar resultados de testes (JUnit)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: backend/test-results/pytest.xml
          if-no-files-found: error
          retention-days: 7

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error
          retention-days: 7

  backend-integration:
    name: Backend — testes de integração (PostgreSQL real)
    runs-on: ubuntu-latest
    # A suíte já gasta ~4m45s na main; com 5 min o job era cancelado a cada teste novo.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ilya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ilya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ilya_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ilya_test
      SECRET_KEY: ci-secret-key-with-at-least-32-characters
      PASSWORD_PEPPER: ci-password-pepper-not-used-in-production
      BACKEND_CORS_ORIGINS: '["http://testserver","http://localhost:5173"]'
      RATE_LIMIT_STORAGE_URI: redis://localhost:6379/0
      DEBUG: "true"
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências (produção + teste)
        run: pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Verificar conectividade com PostgreSQL
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          pg_isready -h localhost -U postgres -d ilya_test 2>&1 | tee -a test-results/integration.log || {
            echo "PostgreSQL indisponível — job de integração não pode continuar." | tee -a test-results/integration.log
            exit 1
          }

      - name: Executar migrations Alembic
        shell: bash
        run: |
          set -o pipefail
          alembic upgrade head 2>&1 | tee -a test-results/integration.log

      - name: Baseline de cobertura unit+contract (para append)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -m "not integration and not pdf_render" -q \
            --cov=app --cov-report= \
            2>&1 | tee -a test-results/integration.log

      - name: Executar testes de integração (cobertura combinada)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -m "integration and not pdf_render" -q --tb=short \
            --junitxml=test-results/integration-results.xml \
            --cov=app --cov-append \
            --cov-report=xml:test-results/integration-coverage.xml \
            --cov-report=term-missing \
            2>&1 | tee -a test-results/integration.log

      - name: Publicar resultados JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-integration-results
          path: backend/test-results/integration-results.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar cobertura de integração
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-integration-coverage
          path: backend/test-results/integration-coverage.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar log de integração
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-integration-log
          path: backend/test-results/integration.log
          if-no-files-found: warn
          retention-days: 7

  backend-pdf-render:
    name: Backend — PDF no Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ilya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ilya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ilya_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ilya_test
      SECRET_KEY: ci-secret-key-with-at-least-32-characters
      PASSWORD_PEPPER: ci-password-pepper-not-used-in-production
      BACKEND_CORS_ORIGINS: '["http://testserver","http://localhost:5173"]'
      RATE_LIMIT_STORAGE_URI: redis://localhost:6379/0
      DEBUG: "true"
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências (produção + teste)
        run: pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Obter versão do Playwright
        id: playwright-version
        shell: bash
        run: |
          version="$(python -m pip show playwright | awk '/^Version:/ {print $2}')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache do Chromium do Playwright
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Falhas de rede/apt são transitórias (o passo já travou ~10 min sem
      # saída). Por isso: timeout curto por tentativa e até 3 tentativas.
      - name: Instalar dependências de sistema do Chromium (apt)
        shell: bash
        timeout-minutes: 12
        run: |
          # security.ubuntu.com ficou fora do ar (InRelease com Err em todas as
          # tentativas). As libs do Chromium vêm do espelho principal do runner,
          # então removemos as fontes security/backports antes do apt update.
          sudo python3 - <<'PY'
          import glob, re
          for path in glob.glob("/etc/apt/sources.list.d/*.sources"):
              out = []
              for stanza in open(path).read().split("\n\n"):
                  if "security.ubuntu.com" in stanza:
                      continue
                  def suites(m):
                      keep = [x for x in m.group(2).split()
                              if not x.endswith(("-security", "-backports"))]
                      return m.group(1) + " ".join(keep)
                  stanza = re.sub(r"(?m)^(Suites:[ \t]*)(.*)$", suites, stanza)
                  if re.search(r"(?m)^Suites:[ \t]*$", stanza):
                      continue
                  out.append(stanza)
              open(path, "w").write("\n\n".join(out))
          for path in ["/etc/apt/sources.list"] + glob.glob("/etc/apt/sources.list.d/*.list"):
              try:
                  lines = open(path).read().splitlines()
              except OSError:
                  continue
              keep = [l for l in lines if not re.search(r"security\.ubuntu\.com|-security|-backports", l)]
              open(path, "w").write("\n".join(keep) + "\n")
          PY
          grep -rhE "^(URIs|Suites|deb )" /etc/apt/sources.list /etc/apt/sources.list.d/ || true

          limpar_apt() {
            # o timeout mata o python/sudo, mas o apt-get filho (root) sobrevive
            # segurando o lock; sem isto as próximas tentativas morrem no lock.
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x apt || true
            sudo pkill -9 -x dpkg || true
            for _ in $(seq 1 30); do
              sudo fuser /var/lib/apt/lists/lock /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock >/dev/null 2>&1 || break
              sleep 1
            done
            sudo dpkg --configure -a || true
          }

          for attempt in 1 2 3; do
            echo "::group::install-deps — tentativa $attempt/3"
            if timeout -s KILL 150 python -m playwright install-deps chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::install-deps falhou na tentativa $attempt/3"
            limpar_apt
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          echo "::error::install-deps falhou nas 3 tentativas"
          exit 1

      - name: Baixar Chromium do Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            echo "::group::install chromium — tentativa $attempt/3"
            if timeout 150 python -m playwright install chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::download do Chromium falhou na tentativa $attempt/3"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          echo "::error::download do Chromium falhou nas 3 tentativas"
          exit 1

      - name: Verificar conectividade com PostgreSQL
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          pg_isready -h localhost -U postgres -d ilya_test 2>&1 | tee -a test-results/pdf-render.log || {
            echo "PostgreSQL indisponível — job de PDF não pode continuar." | tee -a test-results/pdf-render.log
            exit 1
          }

      - name: Executar migrations Alembic
        shell: bash
        run: |
          set -o pipefail
          alembic upgrade head 2>&1 | tee -a test-results/pdf-render.log

      - name: Executar testes de renderização do PDF
        run: python -m pytest -q -m pdf_render

  backend-audit:
    name: Backend — auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências de produção
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Auditar dependências de produção (CVEs conhecidas)
        run: |
          pip install --disable-pip-version-check pip-audit==2.10.1
          pip-audit -r requirements.txt

  production-boot:
    name: Container — migrations e inicialização
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ilya_boot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ilya_boot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construir a imagem de produção
        run: docker build -f backend/Dockerfile.prod -t ilya-backend-ci backend

      - name: Validar migrations em processo dedicado
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2329
          cleanup() {
            docker logs ilya-backend-smoke 2>/dev/null || true
            docker rm -f ilya-backend-smoke 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run --rm \
            --network host \
            --env DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ilya_boot_test \
            --env SECRET_KEY=ci-secret-key-with-at-least-32-characters \
            --env PASSWORD_PEPPER=ci-password-pepper-not-used-in-production \
            ilya-backend-ci \
            python startup.py migrate

      - name: Validar árvore Alembic e upgrade incremental
        shell: bash
        run: |
          set -euo pipefail
          heads=$(docker run --rm --network host \
            --env DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ilya_boot_test \
            --env SECRET_KEY=ci-secret-key-with-at-least-32-characters \
            --env PASSWORD_PEPPER=ci-password-pepper-not-used-in-production \
            ilya-backend-ci alembic heads | wc -l)
          test "$heads" -eq 1 || { echo "Alembic deve possuir exatamente uma head; encontrou $heads."; exit 1; }
          docker run --rm --network host \
            --env DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ilya_boot_test \
            --env SECRET_KEY=ci-secret-key-with-at-least-32-characters \
            --env PASSWORD_PEPPER=ci-password-pepper-not-used-in-production \
            ilya-backend-ci sh -c 'alembic downgrade 0050 && alembic upgrade head'

      - name: Validar boot do servidor sem migration nem seed
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2329
          cleanup() {
            docker logs ilya-backend-smoke 2>/dev/null || true
            docker rm -f ilya-backend-smoke 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name ilya-backend-smoke \
            --network host \
            --env PORT=8000 \
            --env DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ilya_boot_test \
            --env SECRET_KEY=ci-secret-key-with-at-least-32-characters \
            --env PASSWORD_PEPPER=ci-password-pepper-not-used-in-production \
            --env 'BACKEND_CORS_ORIGINS=["http://localhost:5173"]' \
            --env WEB_CONCURRENCY=1 \
            ilya-backend-ci \
            python startup.py serve

          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null; then
              # Em produção /openapi.json é deliberadamente desabilitado
              # (openapi_url=None fora de DEBUG, app/main.py) — 404 é o
              # comportamento correto aqui, não uma falha. A geração interna
              # do contrato (app.openapi()) já é coberta por
              # test_openapi_contract.py no job "Backend — testes".
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/openapi.json)
              if [ "$status" != "404" ]; then
                echo "Esperado 404 em /openapi.json fora de DEBUG, recebido $status."
                exit 1
              fi
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' ilya-backend-smoke 2>/dev/null | grep -q true; then
              echo "O container encerrou antes de ficar pronto."
              exit 1
            fi
            sleep 2
          done

          echo "A API não ficou pronta dentro do limite esperado."
          exit 1


  quality-gate:
    name: Quality Gate — agregador obrigatório
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - frontend
      - frontend-audit
      - backend-tests
      - backend-integration
      - backend-pdf-render
      - backend-audit
      - production-boot
    steps:
      - name: Verificar aprovação de todas as camadas obrigatórias
        shell: bash
        env:
          RESULT_FRONTEND: ${{ needs.frontend.result }}
          RESULT_FRONTEND_AUDIT: ${{ needs.frontend-audit.result }}
          RESULT_BACKEND_TESTS: ${{ needs.backend-tests.result }}
          RESULT_BACKEND_INTEGRATION: ${{ needs.backend-integration.result }}
          RESULT_BACKEND_PDF_RENDER: ${{ needs.backend-pdf-render.result }}
          RESULT_BACKEND_AUDIT: ${{ needs.backend-audit.result }}
          RESULT_PRODUCTION_BOOT: ${{ needs.production-boot.result }}
        run: |
          set -euo pipefail
          failed=0
          for pair in \
            "frontend:${RESULT_FRONTEND}" \
            "frontend-audit:${RESULT_FRONTEND_AUDIT}" \
            "backend-tests:${RESULT_BACKEND_TESTS}" \
            "backend-integration:${RESULT_BACKEND_INTEGRATION}" \
            "backend-pdf-render:${RESULT_BACKEND_PDF_RENDER}" \
            "backend-audit:${RESULT_BACKEND_AUDIT}" \
            "production-boot:${RESULT_PRODUCTION_BOOT}"; do
            job="${pair%%:*}"
            res="${pair#*:}"
            echo "Job ${job}: ${res}"
            if [ "${res}" != "success" ]; then
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo "Quality Gate bloqueado: uma ou mais camadas obrigatórias não obtiveram 'success'."
            exit 1
          fi
          echo "Quality Gate aprovado: todas as camadas obrigatórias concluíram com sucesso."
