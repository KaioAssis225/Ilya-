name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Segunda-feira 06:00 UTC — auditoria contínua de dependências mesmo sem
    # PR/push novo (uma CVE pode ser publicada para uma dependência já
    # instalada a qualquer momento).
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Validar código
        run: npm run lint

      - name: Gerar build de produção
        run: npm run build

  frontend-audit:
    name: Frontend — auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Auditar dependências (CVEs de alta severidade ou crítica)
        run: npm audit --audit-level=high

  backend-tests:
    name: Backend — testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ilya_test
      SECRET_KEY: ci-secret-key-with-at-least-32-characters
      PASSWORD_PEPPER: ci-password-pepper-not-used-in-production
      BACKEND_CORS_ORIGINS: '["http://localhost:5173"]'
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências (produção + teste)
        run: pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Executar testes
        run: python -m pytest -q

  backend-audit:
    name: Backend — auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências de produção
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Auditar dependências de produção (CVEs conhecidas)
        run: |
          pip install --disable-pip-version-check pip-audit==2.10.1
          pip-audit -r requirements.txt

  production-boot:
    name: Container — migrations e inicialização
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ilya_boot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ilya_boot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Construir a imagem de produção
        run: docker build -f backend/Dockerfile.prod -t ilya-backend-ci backend

      - name: Validar migrations em processo dedicado
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2329
          cleanup() {
            docker logs ilya-backend-smoke 2>/dev/null || true
            docker rm -f ilya-backend-smoke 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run --rm \
            --network host \
            --env DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ilya_boot_test \
            --env SECRET_KEY=ci-secret-key-with-at-least-32-characters \
            --env PASSWORD_PEPPER=ci-password-pepper-not-used-in-production \
            ilya-backend-ci \
            python startup.py migrate

      - name: Validar boot do servidor sem migration nem seed
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2329
          cleanup() {
            docker logs ilya-backend-smoke 2>/dev/null || true
            docker rm -f ilya-backend-smoke 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name ilya-backend-smoke \
            --network host \
            --env PORT=8000 \
            --env DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ilya_boot_test \
            --env SECRET_KEY=ci-secret-key-with-at-least-32-characters \
            --env PASSWORD_PEPPER=ci-password-pepper-not-used-in-production \
            --env 'BACKEND_CORS_ORIGINS=["http://localhost:5173"]' \
            --env WEB_CONCURRENCY=1 \
            ilya-backend-ci \
            python startup.py serve

          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null; then
              # Em produção /openapi.json é deliberadamente desabilitado
              # (openapi_url=None fora de DEBUG, app/main.py) — 404 é o
              # comportamento correto aqui, não uma falha. A geração interna
              # do contrato (app.openapi()) já é coberta por
              # test_openapi_contract.py no job "Backend — testes".
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/openapi.json)
              if [ "$status" != "404" ]; then
                echo "Esperado 404 em /openapi.json fora de DEBUG, recebido $status."
                exit 1
              fi
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' ilya-backend-smoke 2>/dev/null | grep -q true; then
              echo "O container encerrou antes de ficar pronto."
              exit 1
            fi
            sleep 2
          done

          echo "A API não ficou pronta dentro do limite esperado."
          exit 1
